      for (let x = 0; x < size; x++) { let run = 1; for (let y = 1; y < size; y++) { if (mod[y][x] === mod[y - 1][x]) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; } }
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) { const c = mod[y][x]; if (c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) p += 3; }

/* CoinReceipt — client-side receipt (PNG + PDF) in the same 1000×1400 layout as the gateway receipts. */
const CoinReceipt = (() => {
  'use strict';
  const TXT = {
    pt: { company: 'Coin Bank', desc: 'Sistema financeiro digital · Coin System', title: 'COMPROVANTE DE TRANSFERÊNCIA', status: 'TRANSAÇÃO CONFIRMADA',
      amount: 'Valor', sats: 'Valor em sats', from: 'Origem (ID)', to: 'Destino (ID)', id: 'ID da transação', date: 'Data e hora', type: 'Tipo', typeV: 'Transferência de coins',

    en: { company: 'Coin Bank', desc: 'Digital financial system · Coin System', title: 'TRANSFER RECEIPT', status: 'TRANSACTION CONFIRMED',
      amount: 'Amount', sats: 'Amount in sats', from: 'Source (ID)', to: 'Destination (ID)', id: 'Transaction ID', date: 'Date & time', type: 'Type', typeV: 'Coin transfer',
      verify: 'Verify at:', foot: 'Automatically generated document. Authenticity can be checked with the QR code.', gen: 'Generated on', coins: 'coins' }
  };
  const toSats = (v) => {

    const s = String(v).trim(); const neg = s.startsWith('-'); const [a, b = ''] = s.replace('-', '').split('.');
    const n = Number(a || 0) * 1e8 + Number((b + '00000000').slice(0, 8)); return neg ? -n : n;
  };
  const satsToCoinStr = (sats) => { const neg = sats < 0; const a = Math.abs(Math.trunc(sats)); const i = Math.floor(a / 1e8), f = String(a % 1e8).padStart(8, '0'); return (neg ? '-' : '') + i + '.' + f; };
  const fmtDate = (d, lang) => { const dt = new Date(d); if (isNaN(dt)) return '—'; return dt.toLocaleString(lang === 'pt' ? 'pt-BR' : 'en-US', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }); };
  const loadImg = (src) => new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  const txSats = (tx) => tx.amountSats != null ? Number(tx.amountSats) : toSats(tx.amountCoins != null ? tx.amountCoins : tx.amount);

  async function canvas(tx, { lang = 'pt', url = '', logo = '/coin-icon.png' } = {}) {
    const T = TXT[lang] || TXT.pt; const W = 1000, H = 1400;
    const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
